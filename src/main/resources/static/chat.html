<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recepcionista virtual · Peluquería</title>
    <style>
        :root {
            --fondo: #f4f3ef;
            --superficie: #ffffff;
            --borde: #e3e0d8;
            --texto: #1f1d1a;
            --texto-suave: #6b665d;
            --acento: #0f6b5c;
            --acento-suave: #e3f1ed;
            --cliente: #1f1d1a;
            --aviso: #8a5a00;
            --aviso-fondo: #fff4dc;
            --error: #a32020;
            --radio: 14px;
            --sombra: 0 1px 2px rgba(31, 29, 26, .06), 0 4px 16px rgba(31, 29, 26, .05);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: var(--fondo);
            color: var(--texto);
            font-size: 15px;
            line-height: 1.45;
        }

        header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 16px 24px;
            border-bottom: 1px solid var(--borde);
            background: var(--superficie);
        }

        header h1 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
        header p { margin: 2px 0 0; color: var(--texto-suave); font-size: 13px; }

        .config { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

        .pastilla {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 9px;
            border-radius: 999px;
            border: 1px solid var(--borde);
            background: var(--fondo);
            font-size: 12px;
            color: var(--texto-suave);
            white-space: nowrap;
        }

        .pastilla.acento { background: var(--acento-suave); border-color: transparent; color: var(--acento); font-weight: 600; }

        main {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 360px;
            gap: 20px;
            max-width: 1240px;
            margin: 0 auto;
            padding: 20px 24px;
            height: calc(100vh - 74px);
        }

        .tarjeta {
            background: var(--superficie);
            border: 1px solid var(--borde);
            border-radius: var(--radio);
            box-shadow: var(--sombra);
        }

        /* ---------- chat ---------- */
        .chat { display: flex; flex-direction: column; min-height: 0; }

        .chat-cabecera {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--borde);
            font-size: 13px;
            color: var(--texto-suave);
        }

        #mensajes {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .burbuja {
            max-width: 78%;
            padding: 10px 14px;
            border-radius: 16px;
            white-space: pre-line;
            word-wrap: break-word;
            animation: aparecer .18s ease-out;
        }

        .burbuja.agente { align-self: flex-start; background: var(--acento-suave); border-bottom-left-radius: 4px; }
        .burbuja.cliente { align-self: flex-end; background: var(--cliente); color: #fff; border-bottom-right-radius: 4px; }
        .burbuja.sistema { align-self: center; background: transparent; color: var(--error); font-size: 13px; }
        .burbuja .meta { display: block; margin-top: 4px; font-size: 11px; opacity: .6; }

        .escribiendo { align-self: flex-start; color: var(--texto-suave); font-size: 13px; padding: 4px 6px; }

        #sugerencias { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 10px; min-height: 8px; }

        .sugerencia {
            border: 1px solid var(--acento);
            background: var(--superficie);
            color: var(--acento);
            border-radius: 999px;
            padding: 5px 12px;
            font: inherit;
            font-size: 13px;
            cursor: pointer;
        }

        .sugerencia:hover { background: var(--acento-suave); }

        form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--borde); }

        #entrada {
            flex: 1;
            min-width: 0;
            padding: 10px 14px;
            border: 1px solid var(--borde);
            border-radius: 10px;
            font: inherit;
            background: var(--fondo);
        }

        #entrada:focus { outline: 2px solid var(--acento); outline-offset: -1px; background: var(--superficie); }

        button.principal {
            padding: 10px 18px;
            border: 0;
            border-radius: 10px;
            background: var(--acento);
            color: #fff;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        button.principal:disabled { opacity: .5; cursor: wait; }

        button.secundario {
            border: 1px solid var(--borde);
            background: var(--superficie);
            border-radius: 8px;
            padding: 5px 10px;
            font: inherit;
            font-size: 12px;
            cursor: pointer;
            color: var(--texto);
        }

        #contador { align-self: center; font-size: 11px; color: var(--texto-suave); min-width: 52px; text-align: right; }

        /* ---------- panel ---------- */
        aside { display: flex; flex-direction: column; gap: 16px; overflow-y: auto; min-height: 0; }

        .panel { padding: 16px; }
        .panel h2 { margin: 0 0 12px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--texto-suave); }

        .fila { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px dashed var(--borde); font-size: 13px; }
        .fila:last-child { border-bottom: 0; }
        .fila dt { color: var(--texto-suave); }
        .fila dd { margin: 0; text-align: right; font-weight: 600; }
        dl { margin: 0; }

        .skills { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 4px 0 2px; }
        .skills .flecha { color: var(--texto-suave); font-size: 12px; }

        .guardrails { margin: 10px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
        .guardrails li { background: var(--aviso-fondo); color: var(--aviso); border-radius: 8px; padding: 6px 9px; font-size: 12px; }

        .vacio { color: var(--texto-suave); font-size: 13px; font-style: italic; }

        .turnos { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
        .turnos li { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding: 7px 9px; border-radius: 8px; background: var(--fondo); }
        .turnos li.nuevo { background: var(--acento-suave); outline: 2px solid var(--acento); }
        .turnos .quien { color: var(--texto-suave); }

        @keyframes aparecer { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

        @media (max-width: 960px) {
            main { grid-template-columns: minmax(0, 1fr); height: auto; padding: 16px; }
            .chat { height: 72vh; }
            header { padding: 14px 16px; }
        }
    </style>
</head>
<body>
<header>
    <div>
        <h1>Recepcionista virtual de la peluquería</h1>
        <p>Agente con skills declarativas · Spring AI + Ollama (modelo local)</p>
    </div>
    <div class="config" id="config"><span class="pastilla">Cargando configuración…</span></div>
</header>

<main>
    <section class="chat tarjeta" aria-label="Conversación con el agente">
        <div class="chat-cabecera">
            <span id="sesion">Conversación nueva</span>
            <button class="secundario" id="reiniciar" type="button">Nueva conversación</button>
        </div>
        <div id="mensajes" aria-live="polite"></div>
        <div id="sugerencias"></div>
        <form id="formulario" autocomplete="off">
            <input id="entrada" maxlength="500" placeholder="Escribí tu mensaje… ej.: quiero un turno el sábado a las 10" aria-label="Mensaje">
            <span id="contador">0/500</span>
            <button class="principal" id="enviar" type="submit">Enviar</button>
        </form>
    </section>

    <aside>
        <section class="panel tarjeta" aria-label="Cómo resolvió el agente el último mensaje">
            <h2>Cómo lo resolvió el agente</h2>
            <div id="detalle"><p class="vacio">Mandá un mensaje para ver qué skills ejecuta el agente.</p></div>
        </section>
        <section class="panel tarjeta" aria-label="Pedido en curso">
            <h2>Pedido en curso</h2>
            <dl id="pedido"></dl>
        </section>
        <section class="panel tarjeta" aria-label="Turnos reservados">
            <h2>Turnos reservados</h2>
            <ul class="turnos" id="turnos"></ul>
        </section>
    </aside>
</main>

<script>
    "use strict";

    // Todo el texto se inserta con textContent (nunca innerHTML): lo que escriba el cliente o
    // devuelva el servidor no puede inyectar HTML ni scripts en la página (prevención de XSS).

    const API_CHAT = "/api/agente/chat";
    const API_AGENTE = "/api/agente";
    const API_TURNOS = "/api/turnos";

    const $ = (id) => document.getElementById(id);
    let sesionId = null;
    let ultimoTurnoReservado = null;

    function elemento(etiqueta, clase, texto) {
        const el = document.createElement(etiqueta);
        if (clase) el.className = clase;
        if (texto !== undefined && texto !== null) el.textContent = texto;
        return el;
    }

    function agregarBurbuja(tipo, texto, meta) {
        const burbuja = elemento("div", "burbuja " + tipo, texto);
        if (meta) burbuja.appendChild(elemento("span", "meta", meta));
        $("mensajes").appendChild(burbuja);
        $("mensajes").scrollTop = $("mensajes").scrollHeight;
        return burbuja;
    }

    function mostrarSugerencias(sugerencias) {
        const contenedor = $("sugerencias");
        contenedor.replaceChildren();
        (sugerencias || []).forEach((texto) => {
            const boton = elemento("button", "sugerencia", texto);
            boton.type = "button";
            boton.addEventListener("click", () => enviar(texto));
            contenedor.appendChild(boton);
        });
    }

    function fila(etiqueta, valor) {
        const contenedor = elemento("div", "fila");
        contenedor.appendChild(elemento("dt", null, etiqueta));
        contenedor.appendChild(elemento("dd", null, valor ?? "—"));
        return contenedor;
    }

    function mostrarDetalle(r) {
        const detalle = $("detalle");
        detalle.replaceChildren();

        const datos = elemento("dl");
        datos.appendChild(fila("Intención", r.intencion ?? "(sin interpretar)"));
        datos.appendChild(fila("Estado", r.estado));
        datos.appendChild(fila("Modelo", r.duracionModeloMs != null ? r.duracionModeloMs + " ms" : "no se consultó"));
        detalle.appendChild(datos);

        detalle.appendChild(elemento("p", "vacio", "Skills ejecutadas:"));
        const skills = elemento("div", "skills");
        if (r.skillsEjecutadas.length === 0) {
            skills.appendChild(elemento("span", "vacio", "ninguna"));
        }
        r.skillsEjecutadas.forEach((nombre, i) => {
            if (i > 0) skills.appendChild(elemento("span", "flecha", "→"));
            skills.appendChild(elemento("span", "pastilla acento", nombre));
        });
        detalle.appendChild(skills);

        if (r.correcciones.length > 0) {
            const lista = elemento("ul", "guardrails");
            r.correcciones.forEach((c) => lista.appendChild(elemento("li", null, "🛡 " + c)));
            detalle.appendChild(lista);
        }
    }

    function mostrarPedido(pedido) {
        const contenedor = $("pedido");
        contenedor.replaceChildren();
        if (!pedido) {
            contenedor.appendChild(elemento("p", "vacio", "No hay ningún pedido en curso."));
            return;
        }
        contenedor.appendChild(fila("Peluquero", pedido.peluquero));
        contenedor.appendChild(fila("Fecha", pedido.fecha ? formatearFecha(pedido.fecha) : null));
        contenedor.appendChild(fila("Hora", pedido.hora));
    }

    const DIAS = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"];

    function formatearFecha(iso) {
        const [anio, mes, dia] = iso.split("-").map(Number);
        const fecha = new Date(anio, mes - 1, dia);
        return DIAS[fecha.getDay()] + " " + String(dia).padStart(2, "0") + "/" + String(mes).padStart(2, "0");
    }

    async function cargarTurnos() {
        try {
            const respuesta = await fetch(API_TURNOS);
            if (!respuesta.ok) return;
            const turnos = (await respuesta.json())
                .filter((t) => t.estadoTurno === "RESERVADO")
                .sort((a, b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora));
            const lista = $("turnos");
            lista.replaceChildren();
            if (turnos.length === 0) {
                lista.appendChild(elemento("li", null, "Sin turnos reservados"));
            }
            turnos.forEach((t) => {
                const item = elemento("li", t.id === ultimoTurnoReservado ? "nuevo" : null);
                item.appendChild(elemento("span", null, formatearFecha(t.fecha) + " · " + t.hora));
                item.appendChild(elemento("span", "quien", t.peluquero.name + " · #" + t.id));
                lista.appendChild(item);
            });
        } catch (e) {
            // El panel de turnos es informativo: si falla, el chat sigue funcionando.
        }
    }

    async function cargarConfiguracion() {
        const config = $("config");
        try {
            const respuesta = await fetch(API_AGENTE);
            const agente = await respuesta.json();
            config.replaceChildren(
                elemento("span", "pastilla acento", "🤖 " + agente.modelo),
                elemento("span", "pastilla", "temperature " + Number(agente.parametros.temperature).toFixed(1)),
                elemento("span", "pastilla", "seed " + (agente.parametros.seed ?? "—")),
                elemento("span", "pastilla", agente.skillsHabilitadas.length + " skills habilitadas")
            );
            config.title = "Skills: " + agente.skillsHabilitadas.join(", ") + "\nDefinición: " + agente.origen;
        } catch (e) {
            config.replaceChildren(elemento("span", "pastilla", "No se pudo leer la configuración del agente"));
        }
    }

    async function enviar(texto) {
        const mensaje = (texto ?? $("entrada").value).trim();
        if (!mensaje) return;

        $("entrada").value = "";
        actualizarContador();
        mostrarSugerencias([]);
        agregarBurbuja("cliente", mensaje);
        bloquear(true);

        const inicio = performance.now();
        const escribiendo = elemento("div", "escribiendo", "La recepcionista está escribiendo…");
        $("mensajes").appendChild(escribiendo);
        const aviso = setTimeout(() => {
            escribiendo.textContent = "Cargando el modelo en memoria (solo pasa la primera vez)…";
        }, 4000);

        try {
            const respuesta = await fetch(API_CHAT, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ sesionId, mensaje })
            });
            const cuerpo = await respuesta.json();
            if (!respuesta.ok) {
                const detalle = cuerpo.erroresValidacion?.join(" ") || cuerpo.message || "Error " + respuesta.status;
                agregarBurbuja("sistema", detalle);
                return;
            }
            sesionId = cuerpo.sesionId;
            $("sesion").textContent = "Sesión " + sesionId.slice(0, 8);
            const segundos = ((performance.now() - inicio) / 1000).toFixed(1);
            agregarBurbuja("agente", cuerpo.respuesta, segundos + " s");
            mostrarSugerencias(cuerpo.sugerencias);
            mostrarDetalle(cuerpo);
            mostrarPedido(cuerpo.pedidoEnCurso);
            if (cuerpo.turnoReservadoId != null) {
                ultimoTurnoReservado = cuerpo.turnoReservadoId;
            }
            cargarTurnos();
        } catch (e) {
            agregarBurbuja("sistema", "No se pudo conectar con el servidor. ¿Está corriendo la aplicación?");
        } finally {
            clearTimeout(aviso);
            escribiendo.remove();
            bloquear(false);
        }
    }

    function bloquear(bloqueado) {
        $("enviar").disabled = bloqueado;
        $("entrada").disabled = bloqueado;
        if (!bloqueado) $("entrada").focus();
    }

    function actualizarContador() {
        $("contador").textContent = $("entrada").value.length + "/500";
    }

    function reiniciar() {
        sesionId = null;
        $("mensajes").replaceChildren();
        $("sesion").textContent = "Conversación nueva";
        $("detalle").replaceChildren(elemento("p", "vacio", "Mandá un mensaje para ver qué skills ejecuta el agente."));
        mostrarPedido(null);
        agregarBurbuja("agente", "¡Hola! Soy la recepcionista virtual. ¿En qué te ayudo?");
        mostrarSugerencias(["¿Quiénes atienden?", "¿Qué horarios hay mañana?", "Quiero un turno el sábado a las 10"]);
        $("entrada").focus();
    }

    $("formulario").addEventListener("submit", (evento) => {
        evento.preventDefault();
        enviar();
    });
    $("entrada").addEventListener("input", actualizarContador);
    $("reiniciar").addEventListener("click", reiniciar);

    cargarConfiguracion();
    cargarTurnos();
    reiniciar();
</script>
</body>
</html>
