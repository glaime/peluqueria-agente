spring.application.name=peluqueria-agente
server.port=8080

# Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:peluqueriadb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger / OpenAPI
springdoc.swagger-ui.path=/api-docs
springdoc.api-docs.path=/v3/api-docs


# MCP Server Configuration
spring.ai.mcp.server.name=peluqueria-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.instructions=Servidor MCP de la app Peluqueria. Permite listar, buscar, crear, actualizar y eliminar peluqueros y turnos.


# Ollama (modelo local). El modelo y sus parametros se definen en agents/recepcionista.agent.md
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.init.pull-model-strategy=never
